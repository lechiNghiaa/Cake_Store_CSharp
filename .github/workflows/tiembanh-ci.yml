name: TiemBanh CI - Test and Docker
on:
  push:
    paths:
      - 'TiemBanh_DoAn/TiemBanh/**'
      - '.github/workflows/tiembanh-ci.yml'
  pull_request:
    paths:
      - 'TiemBanh_DoAn/TiemBanh/**'
      - '.github/workflows/tiembanh-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TiemBanh_DoAn/TiemBanh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore test project
        run: dotnet restore tests/TiemBanh.Tests/TiemBanh.Tests.csproj
      - name: Build test project
        run: dotnet build tests/TiemBanh.Tests/TiemBanh.Tests.csproj -c Release --no-restore
      - name: Run xUnit tests
        run: dotnet test tests/TiemBanh.Tests/TiemBanh.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=test-results.trx' --results-directory ./TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xunit-results
          path: TiemBanh_DoAn/TiemBanh/TestResults/*.trx
          if-no-files-found: ignore

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TiemBanh_DoAn/TiemBanh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test giao diện HTML và tài nguyên tĩnh
        run: node --test tests/web/*.test.cjs

  docker-build:
    runs-on: ubuntu-latest
    needs: [dotnet-tests, web-tests]
    defaults:
      run:
        working-directory: TiemBanh_DoAn/TiemBanh
    steps:
      - uses: actions/checkout@v4
      - name: Build image API
        run: docker build --target api -f deploy/Dockerfile -t tiembanh-api:ci .
      - name: Build image Web
        run: docker build --target web -f deploy/Dockerfile -t tiembanh-web:ci .
